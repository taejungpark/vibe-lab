model_list:
  # ── claude-local: 8asus 코드 인스턴스 ──────────────────────────────────────
  # GPU 0-1-2: qwen3-coder-next 80B (3GPU, CPU 오프로드 없음)
  - model_name: qwen3-coder-next
    litellm_params:
      model: openai/qwen3-coder-next
      api_base: http://8asus:11434/v1
      api_key: ollama

  # GPU 3,4,5: qwen2.5-coder-32b Q4_K_M (단일 GPU 각각, 고속)
  - model_name: qwen3-coder-next   # GPU 3
    litellm_params:
      model: openai/qwen2.5-coder:32b
      api_base: http://8asus:11435/v1
      api_key: ollama

  - model_name: qwen3-coder-next   # GPU 4
    litellm_params:
      model: openai/qwen2.5-coder:32b
      api_base: http://8asus:11436/v1
      api_key: ollama

  - model_name: qwen3-coder-next   # GPU 5
    litellm_params:
      model: openai/qwen2.5-coder:32b
      api_base: http://8asus:11437/v1
      api_key: ollama

  # ── claude-reason: CyberSecurity-2G qwq:32b (GPU 0 / GPU 1) ─────────────
  - model_name: qwq:32b   # GPU 0
    litellm_params:
      model: openai/qwq:32b
      api_base: http://CyberSecurity-2G:11434/v1
      api_key: ollama

  - model_name: qwq:32b   # GPU 1
    litellm_params:
      model: openai/qwq:32b
      api_base: http://CyberSecurity-2G:11435/v1
      api_key: ollama

router_settings:
  routing_strategy: latency-based-routing
  num_retries: 2
  retry_after: 5

litellm_settings:
  drop_params: true
  request_timeout: 600

general_settings:
  master_key: "vibe-lab"
