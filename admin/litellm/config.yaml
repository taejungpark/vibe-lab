model_list:
  # ── claude-local: qwen3-coder-next 80B (GPU triple x2, 최대 2명 동시) ──────
  - model_name: qwen3-coder-next   # GPU 0-1-2
    litellm_params:
      model: openai/qwen3-coder-next
      api_base: http://8asus:11434/v1
      api_key: ollama
      drop_params: true

  - model_name: qwen3-coder-next   # GPU 3-4-5
    litellm_params:
      model: openai/qwen3-coder-next
      api_base: http://8asus:11435/v1
      api_key: ollama
      drop_params: true

  # ── claude-reason: CyberSecurity-2G qwq:32b (GPU 0 / GPU 1) ─────────────
  - model_name: qwq:32b   # GPU 0
    litellm_params:
      model: openai/qwq:32b
      api_base: http://CyberSecurity-2G:11434/v1
      api_key: ollama
      drop_params: true

  - model_name: qwq:32b   # GPU 1
    litellm_params:
      model: openai/qwq:32b
      api_base: http://CyberSecurity-2G:11435/v1
      api_key: ollama
      drop_params: true

router_settings:
  routing_strategy: latency-based-routing
  num_retries: 2
  retry_after: 5

litellm_settings:
  drop_params: true
  request_timeout: 600
  use_chat_completions_url_for_anthropic_messages: true
  callbacks:
    - hooks.drop_thinking_hook

general_settings: {}
