router_settings:
  routing_strategy: round-robin   # 순환 분산 (8인스턴스 고른 활용)
  num_retries: 2
  retry_after: 5

litellm_settings:
  drop_params: true              # 지원하지 않는 파라미터 무시
  request_timeout: 600

general_settings:
  master_key: "vibe-lab"
