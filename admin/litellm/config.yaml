model_list:
  # ── claude-local: 8asus qwen3-coder-next GPU 페어별 분산 (GPU 0-5, 3인스턴스 full GPU) ──
  - model_name: qwen3-coder-next   # GPU 0-1
    litellm_params:
      model: openai/qwen3-coder-next
      api_base: http://8asus:11434/v1
      api_key: ollama

  - model_name: qwen3-coder-next   # GPU 2-3
    litellm_params:
      model: openai/qwen3-coder-next
      api_base: http://8asus:11435/v1
      api_key: ollama

  - model_name: qwen3-coder-next   # GPU 4-5
    litellm_params:
      model: openai/qwen3-coder-next
      api_base: http://8asus:11436/v1
      api_key: ollama

  # ── claude-reason: CyberSecurity-2G qwq:32b (단독) ───────────────────────
